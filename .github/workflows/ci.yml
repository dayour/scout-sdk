name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (tsc project references)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Build docs (Docusaurus)
        run: npm run docs:build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python SDK + test deps
        run: pip install "./python[test]"
      - name: pytest
        run: pytest python/tests -q
